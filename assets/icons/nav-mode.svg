<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Gesture swipe-up triangle + back/home bar -->
  <!-- Back arrow -->
  <path d="M2 9 L4.5 6.5 L4.5 8H7V10H4.5V11.5Z" fill="currentColor"/>
  <!-- Home circle -->
  <circle cx="8.5" cy="13" r="1" fill="currentColor"/>
  <!-- Recents square -->
  <rect x="11" y="11.5" width="2.5" height="2.5" rx="0.4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <!-- Gesture bar (shown when active) -->
  <line x1="4" y1="14.5" x2="12" y2="14.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
</svg>
