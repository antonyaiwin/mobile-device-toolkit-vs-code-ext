<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Outer view bounds (solid) -->
  <rect x="1" y="1" width="14" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <!-- Inner child view (dashed) -->
  <rect x="4" y="4" width="8" height="5" rx="0.5" fill="none" stroke="currentColor" stroke-width="1"
    stroke-dasharray="2 1.5"/>
  <!-- Another child row -->
  <rect x="4" y="10" width="5" height="3" rx="0.5" fill="none" stroke="currentColor" stroke-width="1"
    stroke-dasharray="2 1.5"/>
</svg>
